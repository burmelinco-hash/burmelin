[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# publish = "." serves the whole repo root, so anything committed here is
# reachable at the site root unless it is blocked. One rule per non-web file
# that still exists; the rest were deleted rather than hidden.
# force = true is required: without it an existing file wins over a redirect.
[[redirects]]
  from = "/supabase-schema.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate_banners.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

# Belt and braces alongside the noindex meta tag in admin.html: the header
# applies even when a crawler does not parse the HTML.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
