[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# publish = "." serves the whole repo root, which exposed the schema files,
# the Apps Script backend and the banner generator at the site root.
# force = true is required: without it an existing file wins over a redirect.
[[redirects]]
  from = "/supabase-setup.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-fix.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-variants.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/Code.gs"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate_banners.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

